name: Release CLIProxyAPI Plugin

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.1)"
        required: true
        default: "v1.2.15"

permissions:
  contents: write

env:
  PLUGIN_ID: aistudio2api
  SPIDERMONKEY_TAG: v158.0.1-aistudio2api.2
  LIBWEBP_TAG: v1.6.0-aistudio2api.1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: darwin/arm64+amd64
            goos: darwin
            goarch: all
            os: macos-15
            ext: .dylib
            sm_platform: darwin-all
          - label: linux/amd64
            goos: linux
            goarch: amd64
            os: ubuntu-24.04
            ext: .so
            sm_platform: linux-amd64-glibc228
          - label: linux/arm64
            goos: linux
            goarch: arm64
            os: ubuntu-24.04-arm
            ext: .so
            sm_platform: linux-arm64-glibc228
          - label: windows/amd64
            goos: windows
            goarch: amd64
            os: ubuntu-24.04
            ext: .dll
            sm_platform: windows-amd64
          - label: windows/arm64
            goos: windows
            goarch: arm64
            os: ubuntu-24.04
            ext: .dll
            sm_platform: windows-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true

      - name: Setup Zig 0.16.0 (Linux targets)
        if: matrix.goos == 'linux'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Setup LLVM-MinGW (Windows target)
        if: matrix.goos == 'windows'
        shell: bash
        run: |
          curl -fsSL https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-ubuntu-22.04-x86_64.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/llvm-mingw-20261020-ucrt-ubuntu-22.04-x86_64/bin" >> "$GITHUB_PATH"
          if [ "${{ matrix.goarch }}" = "arm64" ]; then
            echo "CC=aarch64-w64-mingw32-clang" >> "$GITHUB_ENV"
            echo "CXX=aarch64-w64-mingw32-clang++" >> "$GITHUB_ENV"
          else
            echo "CC=x86_64-w64-mingw32-clang" >> "$GITHUB_ENV"
            echo "CXX=x86_64-w64-mingw32-clang++" >> "$GITHUB_ENV"
          fi

      - name: Cache Static Libraries (${{ matrix.sm_platform }})
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            spidermonkey
            libwebp
            spidermonkey-darwin-amd64
            libwebp-darwin-amd64
          key: static-deps-${{ matrix.sm_platform }}-${{ env.SPIDERMONKEY_TAG }}-${{ env.LIBWEBP_TAG }}

      - name: Download Static Libraries (${{ matrix.sm_platform }})
        if: steps.cache-deps.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p spidermonkey libwebp
          if [ "${{ matrix.sm_platform }}" = "darwin-all" ]; then
            mkdir -p spidermonkey-darwin-amd64 libwebp-darwin-amd64
            curl -fsSL "https://github.com/Mag1cFall/firefox/releases/download/${SPIDERMONKEY_TAG}/spidermonkey-${SPIDERMONKEY_TAG}-darwin-arm64.tar.gz" | tar -xz -C spidermonkey
            curl -fsSL "https://github.com/Mag1cFall/libwebp/releases/download/${LIBWEBP_TAG}/libwebp-${LIBWEBP_TAG}-darwin-arm64.tar.gz" | tar -xz -C libwebp
            curl -fsSL "https://github.com/Mag1cFall/firefox/releases/download/${SPIDERMONKEY_TAG}/spidermonkey-${SPIDERMONKEY_TAG}-darwin-amd64.tar.gz" | tar -xz -C spidermonkey-darwin-amd64
            curl -fsSL "https://github.com/Mag1cFall/libwebp/releases/download/${LIBWEBP_TAG}/libwebp-${LIBWEBP_TAG}-darwin-amd64.tar.gz" | tar -xz -C libwebp-darwin-amd64
          elif [ "${{ matrix.sm_platform }}" = "windows-arm64" ] || [ "${{ matrix.sm_platform }}" = "linux-amd64-glibc228" ] || [ "${{ matrix.sm_platform }}" = "linux-arm64-glibc228" ]; then
            curl -fsSL "https://github.com/${{ github.repository }}/releases/download/deps-v1/spidermonkey-${SPIDERMONKEY_TAG}-${{ matrix.sm_platform }}.tar.gz" | tar -xz -C spidermonkey
            curl -fsSL "https://github.com/${{ github.repository }}/releases/download/deps-v1/libwebp-${LIBWEBP_TAG}-${{ matrix.sm_platform }}.tar.gz" | tar -xz -C libwebp
          else
            curl -fsSL "https://github.com/Mag1cFall/firefox/releases/download/${SPIDERMONKEY_TAG}/spidermonkey-${SPIDERMONKEY_TAG}-${{ matrix.sm_platform }}.tar.gz" | tar -xz -C spidermonkey
            curl -fsSL "https://github.com/Mag1cFall/libwebp/releases/download/${LIBWEBP_TAG}/libwebp-${LIBWEBP_TAG}-${{ matrix.sm_platform }}.tar.gz" | tar -xz -C libwebp
          fi

      - name: Determine Version
        id: ver
        shell: bash
        run: |
          RAW_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${RAW_TAG#v}"
          echo "tag=${RAW_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Run Go Vet & Unit Tests (Native Targets)
        if: matrix.goos == 'darwin' || matrix.goos == 'linux'
        shell: bash
        run: |
          export CGO_ENABLED=1
          export CGO_CPPFLAGS="-I${PWD}/spidermonkey/include -I${PWD}/libwebp/include"
          export CGO_LDFLAGS="-L${PWD}/spidermonkey/lib -L${PWD}/libwebp/lib"
          if [ "${{ matrix.goos }}" = "linux" ] && [ "${{ matrix.goarch }}" = "amd64" ]; then
            export CC="zig cc -target x86_64-linux-gnu.2.28"
            export CXX="zig c++ -target x86_64-linux-gnu.2.28"
          elif [ "${{ matrix.goos }}" = "linux" ] && [ "${{ matrix.goarch }}" = "arm64" ]; then
            export CC="zig cc -target aarch64-linux-gnu.2.28"
            export CXX="zig c++ -target aarch64-linux-gnu.2.28"
          fi
          go vet ./...
          go test ./internal/aistudio ./internal/api ./internal/app ./internal/config ./internal/cpa ./internal/imagecodec/... ./internal/proxydial ./internal/resample ./internal/waa

      - name: Build Dynamic Library & Package Zip
        shell: bash
        run: |
          LIB_NAME="${PLUGIN_ID}${{ matrix.ext }}"
          export CGO_ENABLED=1
          export GOOS=${{ matrix.goos }}
          if [ "${{ matrix.goos }}" = "darwin" ]; then
            export MACOSX_DEPLOYMENT_TARGET="13.0"
            LDFLAGS="-s -w -extldflags '-Wl,-exported_symbols_list,${PWD}/cmd/aistudio2api-plugin/exports_darwin.txt -Wl,-dead_strip'"

            # 1. darwin/arm64 (native build + symbol verification + dlopen smoke test)
            rm -rf out && mkdir -p out
            export GOARCH=arm64
            export CGO_CFLAGS="-O2 -mmacosx-version-min=13.0 -arch arm64"
            export CGO_CXXFLAGS="-O2 -mmacosx-version-min=13.0 -arch arm64"
            export CGO_CPPFLAGS="-I${PWD}/spidermonkey/include -I${PWD}/libwebp/include"
            export CGO_LDFLAGS="-L${PWD}/spidermonkey/lib -L${PWD}/libwebp/lib -mmacosx-version-min=13.0 -arch arm64"
            go build -trimpath -ldflags="${LDFLAGS}" -buildmode=c-shared -o "out/${LIB_NAME}" ./cmd/aistudio2api-plugin
            nm -gU -arch arm64 "out/${LIB_NAME}"
            test "$(nm -gU -arch arm64 "out/${LIB_NAME}" | wc -l | tr -d ' ')" = "5"
            CPA_PLUGIN_LIB_PATH="${PWD}/out/${LIB_NAME}" go test -v ./internal/cpa -run TestDynamicLibraryDLOpenABI
            (cd out && zip -qr "../${PLUGIN_ID}_${{ steps.ver.outputs.version }}_darwin_arm64.zip" "${LIB_NAME}")

            # 2. darwin/amd64 (cross-arch build + symbol verification)
            rm -rf out && mkdir -p out
            export GOARCH=amd64
            export CGO_CFLAGS="-O2 -mmacosx-version-min=13.0 -arch x86_64"
            export CGO_CXXFLAGS="-O2 -mmacosx-version-min=13.0 -arch x86_64"
            export CGO_CPPFLAGS="-I${PWD}/spidermonkey-darwin-amd64/include -I${PWD}/libwebp-darwin-amd64/include"
            export CGO_LDFLAGS="-L${PWD}/spidermonkey-darwin-amd64/lib -L${PWD}/libwebp-darwin-amd64/lib -mmacosx-version-min=13.0 -arch x86_64"
            go build -trimpath -ldflags="${LDFLAGS}" -buildmode=c-shared -o "out/${LIB_NAME}" ./cmd/aistudio2api-plugin
            nm -gU -arch x86_64 "out/${LIB_NAME}"
            test "$(nm -gU -arch x86_64 "out/${LIB_NAME}" | wc -l | tr -d ' ')" = "5"
            (cd out && zip -qr "../${PLUGIN_ID}_${{ steps.ver.outputs.version }}_darwin_amd64.zip" "${LIB_NAME}")
          else
            mkdir -p out
            ZIP_NAME="${PLUGIN_ID}_${{ steps.ver.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}.zip"
            export GOARCH=${{ matrix.goarch }}
            export CGO_CPPFLAGS="-I${PWD}/spidermonkey/include -I${PWD}/libwebp/include"
            export CGO_LDFLAGS="-L${PWD}/spidermonkey/lib -L${PWD}/libwebp/lib"
            LDFLAGS="-s -w"
            if [ "${{ matrix.goos }}" = "linux" ]; then
              if [ "${{ matrix.goarch }}" = "amd64" ]; then
                export CC="zig cc -target x86_64-linux-gnu.2.28"
                export CXX="zig c++ -target x86_64-linux-gnu.2.28"
              elif [ "${{ matrix.goarch }}" = "arm64" ]; then
                export CC="zig cc -target aarch64-linux-gnu.2.28"
                export CXX="zig c++ -target aarch64-linux-gnu.2.28"
              fi
              LDFLAGS="-s -w -extldflags '-Wl,--version-script=${PWD}/cmd/aistudio2api-plugin/exports_linux.map -Wl,--gc-sections'"
            fi
            go build -trimpath -ldflags="${LDFLAGS}" -buildmode=c-shared -o "out/${LIB_NAME}" ./cmd/aistudio2api-plugin
            if [ "${{ matrix.goos }}" = "linux" ]; then
              readelf -d "out/${LIB_NAME}" | grep NEEDED
              EXPORTED_SYMS=$(readelf --dyn-syms -W "out/${LIB_NAME}" | awk '($4 == "FUNC" || $4 == "OBJECT") && ($5 == "GLOBAL" || $5 == "WEAK") && $7 != "UND" { sub(/@@?.*/, "", $8); print $8 }' | grep -vE '^(_init|_fini|_edata|_end|__bss_start)$' | sort -u)
              echo "EXPORTED_SYMS=${EXPORTED_SYMS}"
              EXPECTED_SYMS=$(printf '%s\n' cliproxyPluginCall cliproxyPluginFree cliproxyPluginInit cliproxyPluginShutdown cliproxy_plugin_init | sort)
              test "$EXPORTED_SYMS" = "$EXPECTED_SYMS"
              BAD_GLIBC=$(readelf -V "out/${LIB_NAME}" | grep -oE 'GLIBC_[0-9]+\.[0-9]+(\.[0-9]+)?' | sort -u | awk -F_ '{
                split($2, a, ".");
                if ((a[1]+0) > 2 || ((a[1]+0) == 2 && (a[2]+0) > 28)) print $0
              }')
              echo "BAD_GLIBC=${BAD_GLIBC:-none}"
              test -z "$BAD_GLIBC"
              CPA_PLUGIN_LIB_PATH="${PWD}/out/${LIB_NAME}" go test -v ./internal/cpa -run TestDynamicLibraryDLOpenABI
            fi
            (cd out && zip -qr "../${ZIP_NAME}" "${LIB_NAME}")
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: "${{ env.PLUGIN_ID }}_*_${{ matrix.goos }}_*.zip"
  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums.txt & Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd artifacts
          sha256sum *.zip > checksums.txt
          test "$(ls -1 *.zip | wc -l | tr -d ' ')" = "6"
          cat checksums.txt
          RAW_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if ! gh release view "$RAW_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$RAW_TAG" --title "$RAW_TAG" --generate-notes --repo "${{ github.repository }}"
          fi
          for asset in *.zip checksums.txt; do
            for attempt in 1 2 3 4 5; do
              if gh release upload "$RAW_TAG" "$asset" --clobber --repo "${{ github.repository }}"; then
                break
              fi
              sleep 3
            done
          done
